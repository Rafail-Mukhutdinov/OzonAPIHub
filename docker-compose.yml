version: '3.8'

services:
  # -----------------------------------------------------------------------
  # Redis (Для Rate Limiting и Кеширования)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ozon_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------------------
  # База данных PostgreSQL
  # -----------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ozon_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ozon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass2024!}
      POSTGRES_DB: ${POSTGRES_DB:-ozon_saas}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon_user -d ozon_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Бэкенд (FastAPI)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozon_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"  # Возвращаем бэкенд на 8080
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ozon_user}:${POSTGRES_PASSWORD:-SecurePass2024!}@db:5432/${POSTGRES_DB:-ozon_saas}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - INIT_DB_ON_STARTUP=true
      - DEBUG=false
    volumes:
      - ./logs:/app/logs

  # -----------------------------------------------------------------------
  # Фронтенд (Flutter Web)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ozon_frontend
    restart: always
    ports:
      - "80:80"    # Теперь сайт будет открываться просто по IP адресу

volumes:
  postgres_data:
