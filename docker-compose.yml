services:
  # -----------------------------------------------------------------------
  # Redis (Для Rate Limiting и Очереди задач ARQ)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ozon_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------------------
  # База данных PostgreSQL
  # -----------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ozon_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Бэкенд (FastAPI)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozon_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - INIT_DB_ON_STARTUP=true
      - DEBUG=false
    volumes:
      - ./logs:/app/logs

  # -----------------------------------------------------------------------
  # Воркер (ARQ) - отвечает за фоновую синхронизацию
  # -----------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozon_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    command: ["arq", "services.worker.WorkerSettings"]
    volumes:
      - ./logs:/app/logs

  # -----------------------------------------------------------------------
  # Фронтенд (Flutter Web)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ozon_frontend
    restart: always
    ports:
      - "80:80"

volumes:
  postgres_data:
