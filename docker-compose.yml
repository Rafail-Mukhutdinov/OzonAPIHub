version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ozon_db
    restart: always
    environment:
      POSTGRES_USER: ozon_user
      POSTGRES_PASSWORD: SecurePass2024!
      POSTGRES_DB: ozon_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon_user -d ozon_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ozon_backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ozon_user:SecurePass2024!@db:5432/ozon_saas
      - INIT_DB_ON_STARTUP=true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ozon_frontend
    restart: always
    ports:
      - "80:80"

volumes:
  postgres_data:
  