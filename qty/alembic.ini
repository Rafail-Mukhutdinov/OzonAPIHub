# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names;
# file_template = %%(rev)s_%%(slug)s

# sys.path configuration, for finding modules
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to use in "slug" part of filenames
# truncate_slug_length = 40

# set to 'true' to see full SQL output
# log_sql = false

# database URL is now managed in env.py via environment variables
sqlalchemy.url = postgresql://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
