server {
    listen 80;
    server_name seller.home-me.online localhost;

    # Gzip settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Root for landing
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Flutter Web App
    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;

        # Cache for hashed assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # Мобильное приложение (OTA): /app/latest-version, /app/download/*.apk
    # Путь передаётся без изменений (proxy_pass без URI). Нужен для миграции
    # api-ozon.home-me.online с прямого порта 8083 на единый шлюз :80.
    location /app/ {
        proxy_pass http://backend:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Static files (APK, etc)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex off;

        # APK specific caching
        location ~* \.(apk|json)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
